spring.application.name=adconnect

# Database — set these as environment variables (defaults are for local development)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/adconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT — Base64-encoded secret of at least 32 bytes. Generate one with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
